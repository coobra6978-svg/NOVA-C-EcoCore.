<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071824"><title>NOVA-C EcoCore v0.2</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071824;color:#e7f5f6;line-height:1.65}header{background:#0b2531;border-bottom:1px solid #27505a;padding:17px max(18px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:800;font-size:1.25rem;color:#64dbc7}small,.muted{color:#b1c8ce}button,select,input{font:inherit}button,select{border:1px solid #49717a;background:#153c48;color:#f4ffff;border-radius:12px;padding:11px 14px;cursor:pointer}button.primary{background:#16a391;border:0;color:#05232a;font-weight:800}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid white}main{max-width:1000px;margin:auto;padding:20px 15px 50px}.warn{background:#1a3440;border-inline-start:4px solid #efc36a;padding:13px 16px;border-radius:8px}.tag{color:#a9d6d2;font-size:.9rem}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button.active{background:#1ba594;color:#062a2b;font-weight:800}.hidden{display:none!important}.panel{background:#0e2b36;border:1px solid #2a5059;border-radius:20px;padding:22px;margin:18px 0}h2{font-size:1.35rem;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.metric{background:#153945;border-radius:15px;padding:17px;min-height:112px}.metric span{display:block;color:#d1e1e4}.metric b{display:block;font-size:1.75rem;color:#70e1cb;margin-top:8px;font-variant-numeric:tabular-nums}.control{margin:17px 0}.control label{display:block;margin-bottom:8px}input[type=range]{width:100%;accent-color:#26c8b0}select{width:100%;max-width:480px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:510px}th,td{padding:12px 8px;text-align:start;border-bottom:1px solid #345662;font-variant-numeric:tabular-nums}th{color:#92e5d6}.best{color:#70e1cb;font-weight:800}.bad{color:#ffbc9b}.note{font-size:.92rem;color:#b6cdd1}.bar{height:12px;border-radius:12px;background:#294753;overflow:hidden}.fill{height:100%;background:#1fb9a5;border-radius:12px}.bars>div{margin:14px 0}.summary{border-inline-start:3px solid #31bea8;padding:8px 14px;background:#153945;border-radius:7px}footer{text-align:center;color:#a5bfc4;padding:20px;font-size:.82rem}li{margin:7px 0}@media(max-width:550px){.panel{padding:17px}.metric b{font-size:1.5rem}.tabs button{flex:1 1 auto}}
</style></head><body><header><div><div class="logo">◈ NOVA-C EcoCore <small>v0.2</small></div><small id="subtitle"></small></div><button id="lang">English</button></header><main><div class="warn" id="warning"></div><p class="tag" id="privacyline"></p><nav class="tabs" id="tabs"></nav><section id="dashboard" class="view"><div class="panel"><h2 data-i="overview"></h2><div class="grid"><div class="metric"><span data-i="tasks"></span><b id="mTasks"></b></div><div class="metric"><span data-i="servers"></span><b id="mServers"></b></div><div class="metric"><span data-i="baseline"></span><b id="mBase"></b></div><div class="metric"><span data-i="optimized"></span><b id="mOpt"></b></div></div><p id="summary" class="summary"></p></div><div class="panel"><h2 data-i="method"></h2><p data-i="methoddesc"></p><p class="note" id="modelDetail"></p></div></section><section id="sim" class="view hidden"><div class="panel"><h2 data-i="settings"></h2><div class="control"><label id="tasksLabel" for="taskCount"></label><input type="range" id="taskCount" min="20" max="500" step="20" value="120"></div><div class="control"><label id="serversLabel" for="serverCount"></label><input type="range" id="serverCount" min="2" max="16" step="1" value="4"></div><div class="control"><label id="loadLabel" for="intensity"></label><input type="range" id="intensity" min="1" max="10" step="1" value="5"></div><div class="control"><label id="seedLabel" for="seed"></label><input type="range" id="seed" min="1" max="100" step="1" value="42"></div><div class="control"><label for="policy" data-i="policy"></label><select id="policy"><option value="round">Round Robin</option><option value="least">Least Load</option><option value="eco">NOVA-C Heuristic v0.2</option></select></div><button class="primary" id="run" data-i="run"></button></div><div class="panel"><h2 data-i="results"></h2><div class="grid"><div class="metric"><span data-i="energy"></span><b id="rEnergy">—</b></div><div class="metric"><span data-i="latency"></span><b id="rTime">—</b></div><div class="metric"><span data-i="temperature"></span><b id="rHeat">—</b></div></div><p id="runNote" class="note"></p><p id="runDelta" class="summary"></p></div></section><section id="bench" class="view hidden"><div class="panel"><h2 data-i="comparison"></h2><p data-i="comparisondesc"></p><div style="overflow-x:auto"><table><thead><tr><th data-i="strategy"></th><th data-i="energy"></th><th data-i="latency"></th><th data-i="temperature"></th></tr></thead><tbody id="benchRows"></tbody></table></div><p id="benchSummary" class="summary"></p><div id="benchBars" class="bars"></div><div class="actions"><button class="primary" id="benchmark" data-i="rerun"></button><button id="export" data-i="export"></button></div></div></section><section id="roadmap" class="view hidden"><div class="panel"><h2 data-i="roadmap"></h2><div id="roadmapContent"></div></div></section><section id="trust" class="view hidden"><div class="panel"><h2 data-i="trust"></h2><div id="trustContent"></div><div class="actions"><button id="clear" data-i="clear"></button><button id="report" data-i="report"></button></div></div></section></main><footer>NOVA-C EcoCore · Research prototype v0.2 · Synthetic models only · No verified energy savings</footer><script>
'use strict';
const L={ar:{subtitle:'مختبر كفاءة الحوسبة التجريبي',warning:'نموذج بحثي: الطاقة والحرارة والزمن مؤشرات محاكاة فقط، وليست قياسات من هاتفك أو دليلاً على توفير فعلي.',privacyline:'محلي بالكامل • دون حساب • دون اتصال خارجي • دون أذونات',tabs:['الرئيسية','المحاكاة','المقارنة','خارطة الطريق','الثقة والخصوصية'],overview:'لوحة المؤشرات',tasks:'المهام الافتراضية',servers:'الخوادم الافتراضية',baseline:'طاقة Round Robin',optimized:'أقل طاقة في المقارنة',method:'منهجية المحاكاة',methoddesc:'تُولّد المهام باستخدام بذرة ثابتة قابلة للتعديل؛ تحصل الاستراتيجيات الثلاث على المهام نفسها والخوادم نفسها. تقارن المحاكاة توزيع الأحمال فقط، ولا تتحكم في عتاد حقيقي.',modelDetail:'الطاقة = تكلفة تنشيط الخادم + طاقة المعالجة + تكلفة الازدحام؛ الزمن = أكبر زمن عمل متراكم بين الخوادم؛ المؤشر الحراري = أقصى مؤشر حمل وازدحام على خادم. هذه وحدات اصطناعية غير معايرة.',settings:'إعدادات المحاكاة',policy:'استراتيجية التنفيذ',run:'تشغيل التجربة والمقارنة',results:'نتائج الاستراتيجية المختارة',energy:'وحدات طاقة',latency:'زمن افتراضي',temperature:'مؤشر حراري',comparison:'مقارنة تلقائية عادلة',comparisondesc:'تُشغّل الاستراتيجيات الثلاث على مجموعة المهام نفسها وبذرة عشوائية ثابتة. القيمة الأقل أفضل في كل مؤشر. لا يوجد ضمان بتفوّق NOVA-C.',strategy:'الاستراتيجية',rerun:'إعادة المقارنة',export:'تصدير CSV',roadmap:'خارطة التطوير',trust:'الثقة والخصوصية',clear:'إعادة ضبط الجلسة',report:'تقرير JSON',tasklabel:'عدد المهام',serverlabel:'عدد الخوادم',loadlabel:'شدة الحمل',seedlabel:'بذرة التجربة',note:'قيم اصطناعية؛ ليست واط أو درجة مئوية أو ثواني حقيقية.',summary:'أقل استهلاك طاقة في النموذج',compared:'التغير مقابل Round Robin (السالب أفضل)',best:'الأفضل',tie:'تعادل',stages:['v0.2 — مقارنة متكررة وقابلة لإعادة الإنتاج على أحمال متطابقة','v0.3 — اختبار حساسية الأوزان وتعدد سيناريوهات الأحمال','v0.4 — بيانات قياس عامة أو تجارب عتاد فعلية بإذن صريح','لاحقاً — تدقيق مستقل للأمان والأداء قبل أي ادعاءات تجارية'],trustlist:['كل العمليات محلية داخل المتصفح، بلا مكتبات أو طلبات شبكة.','لا نطلب الكاميرا أو الميكروفون أو الموقع أو الملفات.','لا نجمع بيانات شخصية ولا نراقب CPU/GPU الحقيقي.','لا نستخدم localStorage أو ملفات تعريف ارتباط.','التقارير لا تُرسل إلى أي جهة؛ تنزيلها اختياري.','نتائج المحاكاة ليست ادعاءات توفير حقيقي.']},en:{subtitle:'Experimental computing efficiency lab',warning:'Research prototype: energy, heat and time are simulated indicators, not device measurements or evidence of real savings.',privacyline:'Local-only • No account • No external requests • No permissions',tabs:['Dashboard','Simulator','Comparison','Roadmap','Trust & privacy'],overview:'Overview',tasks:'Simulated tasks',servers:'Simulated servers',baseline:'Round Robin energy',optimized:'Lowest benchmark energy',method:'Simulation methodology',methoddesc:'Tasks are generated using an adjustable deterministic seed. All three strategies receive identical tasks and machines. The simulator only compares scheduling, without controlling hardware.',modelDetail:'Energy = activation overhead + processing cost + congestion penalty; time = maximum accumulated machine completion time; thermal index = maximum synthetic load/congestion index. All units are uncalibrated.',settings:'Simulation settings',policy:'Scheduling strategy',run:'Run simulation and comparison',results:'Selected strategy results',energy:'Energy units',latency:'Virtual time',temperature:'Thermal index',comparison:'Automatic fair comparison',comparisondesc:'All strategies use identical tasks and a fixed random seed. Lower is better for all metrics. NOVA-C is not guaranteed to win.',strategy:'Strategy',rerun:'Re-run comparison',export:'Export CSV',roadmap:'Development roadmap',trust:'Trust & privacy',clear:'Reset session',report:'JSON report',tasklabel:'Task count',serverlabel:'Server count',loadlabel:'Load intensity',seedlabel:'Experiment seed',note:'Synthetic values; not real watts, Celsius degrees, or seconds.',summary:'Lowest modeled energy',compared:'Change vs Round Robin (negative is better)',best:'best',tie:'tie',stages:['v0.2 — reproducible comparison using identical workloads','v0.3 — weight sensitivity and multiple workload scenarios','v0.4 — public measurement datasets or consent-based hardware trials','Later — independent security/performance review before commercial claims'],trustlist:['Everything runs locally in the browser, with no external libraries or network requests.','No camera, microphone, location or file permissions requested.','No personal data collected and no actual CPU/GPU monitoring.','No localStorage or cookies.','Reports are optional downloads and are never transmitted.','Simulation results are not evidence of real energy savings.']}};
let language='ar',lastBench=[],lastRun=null;const $=id=>document.getElementById(id),names={round:'Round Robin',least:'Least Load',eco:'NOVA-C Heuristic v0.2'};const t=k=>L[language][k];function config(){return {tasks:+$('taskCount').value,servers:+$('serverCount').value,intensity:+$('intensity').value,seed:+$('seed').value}}function rng(seed){let x=seed>>>0;return ()=>{x=(Math.imul(1664525,x)+1013904223)>>>0;return x/4294967296}}function jobs(c){const rand=rng(c.seed);return Array.from({length:c.tasks},(_,i)=>({id:i,work:(0.5+rand()*2.5)*c.intensity,heatFactor:0.75+rand()*0.5}))}function machines(c){return Array.from({length:c.servers},(_,i)=>({speed:0.85+(i%4)*0.2,efficiency:0.88+(i%3)*0.1,load:0,heatLoad:0,count:0}))}function metrics(ms){const time=Math.max(...ms.map(m=>m.load/m.speed));const energy=ms.reduce((s,m)=>s+(m.count?8+0.68*m.load/m.efficiency+0.016*m.load*m.load/m.speed:0),0);const heat=Math.max(...ms.map(m=>m.count?22+0.16*m.heatLoad/m.speed+0.006*m.load*m.load/m.speed:22));return {energy,time,heat,active:ms.filter(m=>m.count).length}}function simulate(mode,c,taskList){const ms=machines(c);for(const job of taskList){let index=0;if(mode==='round')index=job.id%c.servers;else if(mode==='least')index=ms.reduce((best,m,i)=>m.load/m.speed<ms[best].load/ms[best].speed?i:best,0);else{let bestScore=Infinity;for(let i=0;i<ms.length;i++){const before=metrics(ms),m=ms[i];m.load+=job.work;m.heatLoad+=job.work*job.heatFactor;m.count++;const after=metrics(ms);m.load-=job.work;m.heatLoad-=job.work*job.heatFactor;m.count--;const score=(after.energy-before.energy)*0.50+(after.time-before.time)*0.8+(after.heat-before.heat)*0.9;if(score<bestScore-1e-9){bestScore=score;index=i}}}ms[index].load+=job.work;ms[index].heatLoad+=job.work*job.heatFactor;ms[index].count++}return {mode,...metrics(ms)}}function benchmark(){const c=config(),taskList=jobs(c);lastBench=['round','least','eco'].map(mode=>simulate(mode,c,taskList));lastRun=lastBench.find(x=>x.mode===$('policy').value);render()}function pct(v,base){return base===0?'—':((v/base-1)*100).toFixed(2)+'%'}function render(){const c=config();$('mTasks').textContent=c.tasks;$('mServers').textContent=c.servers;for(const [id,k,val] of [['tasksLabel','tasklabel',c.tasks],['serversLabel','serverlabel',c.servers],['loadLabel','loadlabel',c.intensity],['seedLabel','seedlabel',c.seed]])$(id).textContent=t(k)+': '+val;if(!lastBench.length){$('summary').textContent='—';$('benchRows').innerHTML='';$('benchBars').innerHTML='';$('benchSummary').textContent='—';$('mBase').textContent='—';$('mOpt').textContent='—';$('runDelta').textContent='';return}const base=lastBench[0],minE=Math.min(...lastBench.map(x=>x.energy));$('mBase').textContent=base.energy.toFixed(2);$('mOpt').textContent=minE.toFixed(2);$('summary').textContent=t('summary')+': '+names[lastBench.find(x=>x.energy===minE).mode];const keys=['energy','time','heat'];$('benchRows').innerHTML=lastBench.map(x=>'<tr><td>'+names[x.mode]+'</td>'+keys.map(k=>'<td class="'+(x[k]===Math.min(...lastBench.map(y=>y[k]))?'best':'')+'">'+x[k].toFixed(k==='heat'?1:2)+'</td>').join('')+'</tr>').join('');const eco=lastBench[2];$('benchSummary').textContent='NOVA-C vs Round Robin — '+t('energy')+': '+pct(eco.energy,base.energy)+' · '+t('latency')+': '+pct(eco.time,base.time)+' · '+t('temperature')+': '+pct(eco.heat,base.heat);const max=Math.max(...lastBench.map(x=>x.energy));$('benchBars').innerHTML=lastBench.map(x=>'<div><small>'+names[x.mode]+' — '+x.energy.toFixed(2)+'</small><div class="bar"><div class="fill" style="width:'+((x.energy/max)*100).toFixed(2)+'%"></div></div></div>').join('');if(lastRun){$('rEnergy').textContent=lastRun.energy.toFixed(2);$('rTime').textContent=lastRun.time.toFixed(2);$('rHeat').textContent=lastRun.heat.toFixed(1);$('runNote').textContent=t('note');$('runDelta').textContent=t('compared')+' — '+t('energy')+': '+pct(lastRun.energy,base.energy)+' · '+t('latency')+': '+pct(lastRun.time,base.time)+' · '+t('temperature')+': '+pct(lastRun.heat,base.heat)}}function translate(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('lang').textContent=language==='ar'?'English':'العربية';for(const k of ['subtitle','warning','privacyline','modelDetail'])$(k).textContent=t(k);document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));const active=document.querySelector('.tabs button.active')?.dataset.tab||'dashboard';$('tabs').innerHTML=t('tabs').map((x,i)=>{const tab=['dashboard','sim','bench','roadmap','trust'][i];return '<button data-tab="'+tab+'" class="'+(tab===active?'active':'')+'">'+x+'</button>'}).join('');$('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))}));$('roadmapContent').innerHTML='<ol>'+t('stages').map(x=>'<li>'+x+'</li>').join('')+'</ol>';$('trustContent').innerHTML='<ul>'+t('trustlist').map(x=>'<li>'+x+'</li>').join('')+'</ul>';render()}function download(name,body,type){const blob=new Blob([body],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('lang').onclick=()=>{language=language==='ar'?'en':'ar';translate()};for(const id of ['taskCount','serverCount','intensity','seed'])$(id).oninput=()=>{lastBench=[];lastRun=null;benchmark()};$('run').onclick=benchmark;$('benchmark').onclick=benchmark;$('policy').onchange=()=>{lastRun=lastBench.find(x=>x.mode===$('policy').value);render()};$('export').onclick=()=>{if(!lastBench.length)benchmark();download('novac-v0.2-benchmark.csv','strategy,energy_units,virtual_time,thermal_index,task_count,server_count,intensity,seed\n'+lastBench.map(x=>[x.mode,x.energy,x.time,x.heat,...Object.values(config())].join(',')).join('\n'),'text/csv;charset=utf-8')};$('report').onclick=()=>download('novac-v0.2-report.json',JSON.stringify({version:'0.2',disclaimer:'Synthetic uncalibrated simulation; no real hardware measurement',config:config(),benchmarks:lastBench,selected:lastRun},null,2),'application/json');$('clear').onclick=()=>{$('taskCount').value=120;$('serverCount').value=4;$('intensity').value=5;$('seed').value=42;$('policy').value='round';benchmark()};translate();benchmark();
</script></body></html>
